# Configuration Properties

# Browser Configuration
# Supported browsers: chrome, firefox, edge, chrome-headless
# Options: chrome, firefox, edge, chrome-headless
browser=chrome

# Application URL
baseUrl=https://www.saucedemo.com/

# Wait Timeouts (in seconds)
implicitWait=10
explicitWait=10

# Screenshot Configuration
captureScreenshot=true

# Valid Users for Testing
# standard_user
# locked_out_user
# problem_user
# performance_glitch_user
# error_user
# visual_user

# Wait Times (in seconds)
implicitWait=10
explicitWait=10

# Screenshot Settings
takeScreenshotOnFailure=true
takeScreenshotOnSuccess=false

# Test Environment
environment=qa

# Parallel Execution
parallel.execution=true
thread.count=3
